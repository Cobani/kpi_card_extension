<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KPI Card — Format</title>
    <link rel="preload" href="./fonts/Lato-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./configure.css" />
  </head>

  <body>
    <nav class="tabs" id="tabs" role="tablist"></nav>

    <main class="body" id="panels"></main>

    <footer class="footer">
      <button class="btn" id="reset-tab" type="button" title="Restore Figma defaults for this tab">Reset tab</button>
      <span class="status" id="status"></span>
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn btn--primary" id="done" type="button">Done</button>
    </footer>

    <script src="./icons.js"></script>
    <script src="./config.js"></script>
    <script src="./configure.js"></script>
    <script>
      // Tableau Extensions API is bundled in ./lib (no CDN). Skipped when a dev mock already defined it.
      if (!(window.tableau && window.tableau.extensions)) {
        document.write('<script src="./lib/tableau.extensions.1.17.0.min.js"><\/script>');
      }
    </script>
    <script>
      if (window.tableau && window.tableau.extensions) {
        window.KpiCardConfigure.init();
      } else {
        console.error('Could not load the Tableau Extensions API library.');
      }
    </script>
  </body>
</html>
