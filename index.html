<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KPI Card</title>
    <link rel="stylesheet" href="./fonts/fonts.css?v=22ceb76171" />
    <link rel="stylesheet" href="./card.css?v=cf0068d4d6" />
    <script src="./timing.js?v=666dc99b7c"></script>
    <script src="./icons.js?v=6a0dce9bfa"></script>
    <script src="./config.js?v=16e0120a5e"></script>
    <script src="./card.js?v=bb353f804e"></script>
  </head>

  <body>
    <div id="card" class="card is-empty">
      <div class="head">
        <div id="icon" class="icon" aria-hidden="true"></div>
        <div id="title" class="title"></div>
        <div id="explanation" class="explanation"></div>
      </div>

      <div class="metric">
        <div id="metric-row" class="metric-row">
          <div id="number" class="number">
            <span id="unit-pre" class="unit unit--pre"></span><span id="value" class="value"></span><span id="unit-post" class="unit unit--post"></span>
          </div>
          <div id="change" class="change" hidden>
            <span id="change-arrow" class="change-arrow"></span><span id="change-text" class="change-text"></span>
          </div>
        </div>
      </div>

      <div id="bottom" class="bottom">
        <svg id="chart" class="chart" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="bottom-text" class="bottom-text"></div>
      </div>

      <div id="hint" class="hint"></div>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip"></div>

    <script>
      // Tableau Extensions API is bundled in ./lib (no CDN). Skipped when a dev mock already defined it.
      if (!(window.tableau && window.tableau.extensions)) {
        document.write('<script src="./lib/tableau.extensions.1.17.0.min.js?v=276479f2c7"><\/script>');
      }
    </script>
    <script>
      if (window.ExtTiming) ExtTiming.mark('Tableau API library loaded');
      if (window.tableau && window.tableau.extensions) {
        window.KpiCard.init();
      } else {
        document.getElementById('hint').textContent =
            'Could not load the Tableau Extensions API library.';
      }
    </script>
  </body>
</html>
